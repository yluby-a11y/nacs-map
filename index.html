    card.innerHTML=`<div class="row"><div class="name">${rec?'⭐ ':''}${it.name}</div><div class="op">${it.operator}</div></div><div class="meta">${it.status} · ${it.connector}${it.count?' · NACS '+it.count+'면':''}${detour!=null?' · 경로 이탈 약 '+detour.toFixed(1)+'km · 진행 '+Math.round(progress)+'%':''}</div><div class="actions"><a class="btn kakao" target="_blank" href="${myPos&&dest&&c?viaUrl(it,c):kakaoTo(it,c)}">${myPos&&dest&&c?'카카오맵 경유 길찾기':(c?'카카오맵 길찾기':'카카오맵에서 찾기')}</a><a class="btn search" target="_blank" href="${kakaoSearch(it)}">장소 확인</a>${c?`<button class="locate" onclick="map.setView([${c.lat},${c.lon}],14);window.scrollTo({top:0,behavior:'smooth'})">지도에서 보기</button>`:''}</div>`;list.appendChild(card);});
  document.getElementById('status').textContent=`${arr.length}개 표시 · 지도 좌표 확인 ${Object.keys(coords).length}/${items.length}개${myPos&&dest?' · 가는 길 추천순':''}`;
}
async function geocodeMissing(){
  // 공개 지오코딩은 처음 1회만 천천히 실행하고 결과를 기기에 저장합니다.
  for(let i=0;i<items.length;i++){
    if(coords[i]) continue;
    const it=items[i];
    const queries=[it.name+' 대한민국', cleanName(it.name)+' 휴게소 대한민국'];
    let found=null;
    for(const qq of queries){
      try{
        const u='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q='+encodeURIComponent(qq);
        const res=await fetch(u,{headers:{'Accept-Language':'ko'}});
        const d=await res.json();
        if(d&&d[0]){found={lat:+d[0].lat,lon:+d[0].lon};break}
      }catch(e){}
    }
    if(found){coords[i]=found;localStorage.setItem('nacs_coords_v1',JSON.stringify(coords));}
    if(i%4===0) render();
    await new Promise(r=>setTimeout(r,1100));
  }
  render();
}

let myPos=null, dest=null;
function hav(a,b){const R=6371,toRad=x=>x*Math.PI/180,dLat=toRad(b.lat-a.lat),dLon=toRad(b.lon-a.lon);const q=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(q));}
function segDistanceKm(p,a,b){ // equirectangular projection, sufficient for ranking
 const lat0=(a.lat+b.lat+p.lat)/3*Math.PI/180, sx=111.32*Math.cos(lat0), sy=110.57;
 const ax=a.lon*sx, ay=a.lat*sy, bx=b.lon*sx, by=b.lat*sy, px=p.lon*sx, py=p.lat*sy;
 const vx=bx-ax,vy=by-ay, wx=px-ax,wy=py-ay, vv=vx*vx+vy*vy; let t=vv?Math.max(0,Math.min(1,(wx*vx+wy*vy)/vv)):0;
 return Math.hypot(px-(ax+t*vx),py-(ay+t*vy));
}
async function geocodeText(q){
 const u='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q='+encodeURIComponent(q+' 대한민국');
 const r=await fetch(u,{headers:{'Accept-Language':'ko'}}),d=await r.json(); if(!d||!d[0]) throw new Error('notfound');
 return {lat:+d[0].lat,lon:+d[0].lon,name:q};
}
async function setDestination(){const q=document.getElementById('destination').value.trim();if(!q)return alert('목적지를 입력해 주세요.');try{dest=await geocodeText(q);document.getElementById('routeInfo').style.display='block';document.getElementById('routeInfo').textContent='목적지 설정: '+q+' · 내 위치를 기준으로 가는 길 NACS를 우선 표시합니다.'; if(!myPos) getMyPos(false); render();}catch(e){alert('목적지를 찾지 못했습니다. 장소명이나 주소를 조금 더 구체적으로 입력해 주세요.');}}
function clearDestination(){dest=null;document.getElementById('routeInfo').style.display='none';render();}
function getMyPos(show=true){if(!navigator.geolocation){if(show)alert('위치 기능을 사용할 수 없습니다.');return;}navigator.geolocation.getCurrentPosition(p=>{myPos={lat:p.coords.latitude,lon:p.coords.longitude};if(show){L.circleMarker([myPos.lat,myPos.lon],{radius:8}).addTo(map).bindPopup('내 위치').openPopup();map.setView([myPos.lat,myPos.lon],10);}render();},()=>{if(show)alert('브라우저에서 위치 권한을 허용해 주세요.');});}
function viaUrl(it,c){if(!myPos||!dest||!c)return kakaoTo(it,c); return 'https://map.kakao.com/link/by/car/'+encodeURIComponent('현재 위치')+','+myPos.lat+','+myPos.lon+'/'+encodeURIComponent(it.name)+','+c.lat+','+c.lon+'/'+encodeURIComponent(dest.name)+','+dest.lat+','+dest.lon;}

function showMyLocation(){
 getMyPos(true); return; if(!navigator.geolocation) return alert('위치 기능을 사용할 수 없습니다.');
 navigator.geolocation.getCurrentPosition(p=>{
   L.circleMarker([p.coords.latitude,p.coords.longitude],{radius:8}).addTo(map).bindPopup('내 위치').openPopup();
   map.setView([p.coords.latitude,p.coords.longitude],10);
 },()=>alert('브라우저에서 위치 권한을 허용해 주세요.'));
}
document.getElementById('search').addEventListener('input',render);
document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{document.querySelectorAll('.chip').forEach(y=>y.classList.remove('active'));x.classList.add('active');selectedOp=x.dataset.op;render();});
render(); geocodeMissing();
</script>
