 return 'https://map.kakao.com/?sName='+encodeURIComponent('현재위치')+'&sX='+myPos.lon+'&sY='+myPos.lat+'&eName='+encodeURIComponent(dest.name)+'&eX='+dest.lon+'&eY='+dest.lat+'&viaName='+encodeURIComponent(it.name)+'&viaX='+c.lon+'&viaY='+c.lat;
}

function popup(it,c){return `<b>${it.name}</b><br>${it.operator} · ${it.connector}<br><br><a href="${kakaoTo(it,c)}" target="_blank">카카오맵 길찾기</a>`}
function routeProgressKm(p){
 if(!route||route.length<2)return 99999;let best=99999,bp=99999,cum=0;
 for(let i=1;i<route.length;i++){const a=route[i-1],b=route[i],d=segDistanceKm(p,a,b),seg=hav(a,b);
  if(d<best){const da=hav(a,p),db=hav(p,b),t=(da+db)?Math.max(0,Math.min(1,da/(da+db))):0;best=d;bp=cum+t*seg}cum+=seg}return bp;
}
function routeDistanceKm(p){if(!route)return 99999;let d=99999;for(let i=1;i<route.length;i++)d=Math.min(d,segDistanceKm(p,route[i-1],route[i]));return d}
function render(){
 const q=document.getElementById('search').value.trim().toLowerCase(),list=document.getElementById('list');list.innerHTML='';markers.clearLayers();let arr=[];
 items.forEach((it,i)=>{if(selectedOp!=='ALL'&&it.operator!==selectedOp)return;if(q&&!((it.name+' '+it.operator).toLowerCase().includes(q)))return;const c=coords[i];let detour=null,progress=null;if(c&&route){detour=routeDistanceKm(c);progress=routeProgressKm(c)}arr.push({it,i,c,detour,progress});});
 if(recommendMode&&route){
   arr=arr.filter(x=>x.c&&x.detour<=15);
   arr.sort((a,b)=>{
     // Encounter order is primary. At nearly the same route position, prefer rest areas.
     if(Math.abs(a.progress-b.progress)>8)return a.progress-b.progress;
     const ah=/휴게소/.test(a.it.name),bh=/휴게소/.test(b.it.name);if(ah!==bh)return ah?-1:1;
     const ap=a.it.status.includes('순차 오픈')?1:0,bp=b.it.status.includes('순차 오픈')?1:0;if(ap!==bp)return ap-bp;
     return a.progress-b.progress;
   });
 }
 arr.forEach((x,rank)=>{const {it,c,detour,progress}=x;if(c)L.marker([c.lat,c.lon]).addTo(markers).bindPopup(popup(it,c));const card=document.createElement('div');card.className='card';
 card.innerHTML=`<div class="row"><div class="name">${recommendMode?'⭐ ':''}${it.name}</div><div class="op">${it.operator}</div></div><div class="meta">${it.status} · ${it.connector}${it.count?' · NACS '+it.count+'면':''}${recommendMode?' · 경로 이탈 '+detour.toFixed(1)+'km · 출발 후 약 '+Math.round(progress)+'km':''}</div><div class="actions">${recommendMode&&c?`<a class="btn kakao" target="_blank" href="${kakaoViaUrl(it,c)}">카카오맵 경유 길찾기</a>`:`<a class="btn kakao" target="_blank" href="${kakaoTo(it,c)}">${c?'카카오맵 길찾기':'카카오맵에서 찾기'}</a>`}<a class="btn search" target="_blank" href="${kakaoSearch(it)}">장소 확인</a>${c?`<button class="locate" onclick="map.setView([${c.lat},${c.lon}],14);window.scrollTo({top:0,behavior:'smooth'})">지도에서 보기</button>`:''}</div>`;list.appendChild(card);});
 document.getElementById('status').textContent=recommendMode?`추천 ${arr.length}개 · 실제 경로 15km 이내 · 출발지에서 만나는 순서`:`${arr.length}개 표시 · 지도 좌표 확인 ${Object.keys(coords).length}/${items.length}개`;
}
async function geocodeOne(i){
 if(coords[i])return coords[i];const it=items[i],base=cleanName(it.name),qs=[it.name+' 대한민국',base+'휴게소 대한민국',base+' 고속도로 휴게소 대한민국',base+' 대한민국'];
 for(const qq of qs){try{const u='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q='+encodeURIComponent(qq),res=await fetch(u,{headers:{'Accept-Language':'ko'}}),d=await res.json();if(d&&d[0]){coords[i]={lat:+d[0].lat,lon:+d[0].lon};localStorage.setItem('nacs_coords_v10',JSON.stringify(coords));return coords[i]}}catch(e){}}
 return null;
}
let myPos=null,dest=null,route=null,routeLayer=null,recommendMode=false;
function hav(a,b){const R=6371,toRad=x=>x*Math.PI/180,dLat=toRad(b.lat-a.lat),dLon=toRad(b.lon-a.lon);const q=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(q));}
function segDistanceKm(p,a,b){ // equirectangular projection, sufficient for ranking
 const lat0=(a.lat+b.lat+p.lat)/3*Math.PI/180, sx=111.32*Math.cos(lat0), sy=110.57;
 const ax=a.lon*sx, ay=a.lat*sy, bx=b.lon*sx, by=b.lat*sy, px=p.lon*sx, py=p.lat*sy;
 const vx=bx-ax,vy=by-ay, wx=px-ax,wy=py-ay, vv=vx*vx+vy*vy; let t=vv?Math.max(0,Math.min(1,(wx*vx+wy*vy)/vv)):0;
 return Math.hypot(px-(ax+t*vx),py-(ay+t*vy));
}
async function geocodeText(q){
 const variants=[q,q+' 대한민국',q+' 관광지 대한민국',q+' 역 대한민국']; let all=[];
 for(const qq of variants){try{const u='https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&namedetails=1&limit=5&countrycodes=kr&q='+encodeURIComponent(qq);const r=await fetch(u,{headers:{'Accept-Language':'ko'}});const d=await r.json();if(Array.isArray(d))all.push(...d);}catch(e){}}
 const seen=new Set(),out=[]; for(const x of all){const key=(+x.lat).toFixed(5)+','+(+x.lon).toFixed(5);if(seen.has(key))continue;seen.add(key);out.push({lat:+x.lat,lon:+x.lon,name:(x.namedetails&&(x.namedetails['name:ko']||x.namedetails.name))||x.display_name.split(',')[0],display:x.display_name});} return out.slice(0,6);
}
async function setDestination(){
 const q=document.getElementById('destination').value.trim();if(!q)return alert('목적지를 입력해 주세요.');
 const box=document.getElementById('destResults');box.innerHTML='<div style="padding:10px">검색 중...</div>';box.style.display='block';
 try{const results=await geocodeText(q);if(!results.length){box.innerHTML='<div style="padding:10px">검색 결과가 없습니다. 예: 경주 불국사</div>';return;}window._destCandidates=results;box.innerHTML=results.map((r,i)=>`<button onclick="chooseDestination(${i})" style="display:block;width:100%;text-align:left;background:white;color:#111827;border-bottom:1px solid #e5e7eb;border-radius:0;padding:11px"><b>${r.name}</b><br><span style="font-size:11px;color:#64748b">${r.display}</span></button>`).join('');}catch(e){box.innerHTML='<div style="padding:10px">검색에 실패했습니다. 잠시 후 다시 시도해 주세요.</div>';}
}
function chooseDestination(i){const r=window._destCandidates[i];if(!r)return;dest={lat:r.lat,lon:r.lon,name:r.name};recommendMode=false;document.getElementById('destination').value=r.name;document.getElementById('destResults').style.display='none';document.getElementById('routeInfo').style.display='block';document.getElementById('routeInfo').textContent='목적지 선택 완료: '+r.name+' · 이제 추천 정렬을 눌러 주세요.';L.marker([dest.lat,dest.lon]).addTo(map).bindPopup('목적지: '+r.name);render();}
async function recommendSort(){
 if(!dest)return alert('먼저 목적지를 검색해서 결과에서 선택해 주세요.');
 if(!myPos){try{await getMyPos(false)}catch(e){return alert('추천 정렬에는 위치 권한이 필요합니다.')}}
 const info=document.getElementById('routeInfo');info.style.display='block';info.textContent='자동차 경로를 계산 중...';
 try{
  const u=`https://router.project-osrm.org/route/v1/driving/${myPos.lon},${myPos.lat};${dest.lon},${dest.lat}?overview=full&geometries=geojson`,r=await fetch(u),d=await r.json();if(!d.routes?.length)throw 0;
  route=d.routes[0].geometry.coordinates.map(c=>({lat:c[1],lon:c[0]}));if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.polyline(route.map(x=>[x.lat,x.lon]),{weight:5}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[20,20]});
  // First use cached coordinates immediately. Resolve unresolved REST AREAS only, sequentially, because they are priority recommendations.
  recommendMode=true;render();
  const missing=items.map((it,i)=>({it,i})).filter(x=>/휴게소/.test(x.it.name)&&!coords[x.i]);
  if(missing.length){info.textContent=`경로 계산 완료 · 휴게소 위치 확인 중 (${missing.length}개)`;let k=0;for(const x of missing){await geocodeOne(x.i);k++;if(k%4===0)render();await new Promise(z=>setTimeout(z,1050));}}
  render();info.textContent=`추천 정렬 완료 · 추천 충전소에서 ‘카카오맵 경유 길찾기’를 누르세요 · 자동차 경로 약 ${(d.routes[0].distance/1000).toFixed(0)}km · 경로 15km 이내를 출발지에서 만나는 순서로 표시합니다.`;
 }catch(e){info.textContent='경로 계산에 실패했습니다. 잠시 후 다시 눌러 주세요.'}
}
document.getElementById('destination').addEventListener('keydown',e=>{if(e.key==='Enter')setDestination();});
document.getElementById('search').addEventListener('input',render);
document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{document.querySelectorAll('.chip').forEach(y=>y.classList.remove('active'));x.classList.add('active');selectedOp=x.dataset.op;render();});
render();
</script>
