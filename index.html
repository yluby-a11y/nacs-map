<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전국 NACS 충전지도 V6.1</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f6f7f9;color:#111827}header{padding:13px;background:#111827;color:#fff}h1{font-size:18px;margin:0}header p{font-size:12px;margin:4px 0 0;color:#cbd5e1}.bar{display:flex;gap:7px;padding:9px;background:#fff;flex-wrap:wrap}input{flex:1;min-width:190px;padding:11px;border:1px solid #ddd;border-radius:10px}button,.chip,a{border:0;border-radius:10px;padding:10px;font-weight:700;text-decoration:none}.dark{background:#111827;color:#fff}.chip{background:#e8edf3}.chip.on{background:#111827;color:#fff}#map{height:43vh;min-height:320px}#msg{padding:9px 12px;background:#fff7ed;color:#9a3412;font-size:12px}.results{background:#fff;max-height:200px;overflow:auto}.results button{width:100%;text-align:left;background:#fff;border-radius:0;border-bottom:1px solid #eee}.list{padding:10px;display:grid;gap:8px}.card{background:#fff;padding:12px;border-radius:13px}.meta{font-size:12px;color:#64748b;margin:6px 0}.k{background:#fee500;color:#191919;display:inline-block}.b{background:#e8eef7;color:#1e3a5f;display:inline-block}</style></head><body><header><h1>⚡ 전국 NACS 충전지도 V6.1</h1><p>TESLA · WATER · CHAEVI · SK일렉링크</p></header><div class="bar"><input id="q" placeholder="목적지 입력 (예: 불국사)"><button class="dark" onclick="searchDest()">목적지 설정</button><button class="dark" onclick="clearDest()">해제</button></div><div id="res" class="results" style="display:none"></div><div id="msg">목적지를 설정하면 실제 자동차 경로 주변의 고속도로 휴게소 NACS를 최우선 추천합니다.</div><div id="map"></div><div class="bar"><span class="chip on" data-op="ALL">전체</span><span class="chip" data-op="WATER">WATER</span><span class="chip" data-op="CHAEVI">CHAEVI</span><span class="chip" data-op="SK일렉링크">SK일렉링크</span></div><div id="list" class="list"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const W1="강릉대관령휴게소 강릉방향|강릉대관령휴게소 인천방향|경주휴게소 부산방향|고성공룡나라휴게소 대전방향|고성공룡나라휴게소 통영방향|괴산휴게소 창원방향|군위휴게소 부산방향|남성주참외휴게소 양평방향|내린천휴게소 서울방향|내린천휴게소 양양방향|문경휴게소 양평방향|문경휴게소 창원방향|문막휴게소 인천방향|산청휴게소 통영방향|서여주휴게소 창원방향|안동휴게소 부산방향|여주휴게소 강릉방향|영산휴게소 창원방향|영천휴게소 대구방향|옥계휴게소 속초방향|용인휴게소 강릉방향|용인휴게소 인천방향|원주휴게소 춘천방향|의성휴게소 청주방향|천등산휴게소 제천방향|천등산휴게소 평택방향|청통휴게소 대구방향|충주휴게소 양평방향|칠곡휴게소 서울방향|평창휴게소 강릉방향|함안휴게소 부산방향|함안휴게소 순천방향|현풍휴게소 대구방향|현풍휴게소 창원방향|홍천강휴게소 춘천방향|홍천휴게소 서울방향|홍천휴게소 양양방향|횡성휴게소 강릉방향",W2="구정휴게소 삼척방향|구정휴게소 속초방향|금왕휴게소 제천방향|금왕휴게소 평택방향|동해휴게소 삼척방향|문막휴게소 강릉방향|서산휴게소 목포방향|속리산휴게소 청주방향|신탄진휴게소 서울방향|안성맞춤휴게소 제천방향|안성맞춤휴게소 평택방향|예산휴게소 당진방향|원주휴게소 부산방향|음성휴게소 남이방향|음성휴게소 하남방향|입장거봉포도휴게소 서울방향|죽암휴게소 서울방향|천안호두휴게소 부산방향|청주휴게소 서울방향|춘천휴게소 부산방향|충주휴게소 창원방향|치악휴게소 부산방향|화서휴게소 영덕방향",CV="경산휴게소 서울방향|김천휴게소 부산방향|김천휴게소 서울방향|언양휴게소 서울방향|추풍령휴게소 부산방향|칠곡휴게소 부산방향|평사휴게소 부산방향|거창휴게소 광주방향|거창휴게소 대구방향|문산휴게소 순천방향|외동휴게소 부산방향|외동휴게소 포항방향|영천휴게소 포항방향|와촌휴게소 포항방향|함평천지휴게소 서울방향|울주휴게소 울산방향|남성주참외휴게소 창원방향|논공휴게소 대구방향|성주휴게소 양평방향|칠서휴게소 양평방향|함양휴게소 대전방향|함양휴게소 통영방향",SK="김제휴게소 새만금방향|김제휴게소 전주방향|이서휴게소 순천방향|이서휴게소 천안방향|서여주휴게소 양평방향|금산인삼랜드휴게소 대전방향";
const S=[...W1.split('|').map(n=>({o:'WATER',n,s:'운영 확인 대상'})),...W2.split('|').map(n=>({o:'WATER',n,s:'2026-10 순차 오픈 · 개통 확인 필요',p:1})),...CV.split('|').map(n=>({o:'CHAEVI',n,s:'공식 NACS 목록'})),...SK.split('|').map(n=>({o:'SK일렉링크',n,s:'운영 확인'}))];
const map=L.map('map').setView([36.2,127.8],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let me,dest,route,line,dm,filter='ALL';const $=x=>document.getElementById(x),say=x=>$('msg').textContent=x;
function hav(a,b){let R=6371,d=Math.PI/180,x=(b.lat-a.lat)*d,y=(b.lon-a.lon)*d,z=Math.sin(x/2)**2+Math.cos(a.lat*d)*Math.cos(b.lat*d)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(z))}
function seg(p,a,b){let k=Math.cos((a.lat+b.lat+p.lat)/3*Math.PI/180)*111.32,sy=110.57,A=[a.lon*k,a.lat*sy],B=[b.lon*k,b.lat*sy],P=[p.lon*k,p.lat*sy],vx=B[0]-A[0],vy=B[1]-A[1],t=Math.max(0,Math.min(1,((P[0]-A[0])*vx+(P[1]-A[1])*vy)/(vx*vx+vy*vy||1)));return Math.hypot(P[0]-A[0]-t*vx,P[1]-A[1]-t*vy)}
function rd(p){let m=1e9;for(let i=1;i<route.length;i++)m=Math.min(m,seg(p,route[i-1],route[i]));return m}
async function geo(q){for(const u of['https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=kr&accept-language=ko&q='+encodeURIComponent(q),'https://photon.komoot.io/api/?limit=6&lang=ko&q='+encodeURIComponent(q+' 대한민국')]){try{let r=await fetch(u);if(!r.ok)continue,d=await r.json(),a=Array.isArray(d)?d.map(x=>({lat:+x.lat,lon:+x.lon,name:x.display_name})):(d.features||[]).map(x=>({lat:+x.geometry.coordinates[1],lon:+x.geometry.coordinates[0],name:[x.properties.name,x.properties.city,x.properties.state].filter(Boolean).join(' · ')}));if(a.length)return a}catch(e){}}return[]}
async function stationGeo(s){let key='n61:'+s.n;try{let x=JSON.parse(localStorage.getItem(key));if(x)return x}catch(e){}let base=s.n.replace(/(서울|부산|대구|광주|순천|통영|양평|창원|강릉|인천|춘천|속초|제천|평택|청주|포항|울산|대전|삼척|목포|당진|남이|하남|영덕|새만금|전주)방향/g,'');let a=await geo(base);if(a[0]){let x={lat:a[0].lat,lon:a[0].lon};localStorage.setItem(key,JSON.stringify(x));return x}}
function getMe(){return new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lon:p.coords.longitude}),no,{enableHighAccuracy:true,timeout:8000,maximumAge:120000}))}
async function searchDest(){let q=$('q').value.trim();if(!q)return;say('목적지를 찾는 중…');let a=await geo(q);if(!a.length){say('검색 실패. 지역명을 함께 입력해 보세요.');return}$('res').innerHTML='';$('res').style.display='block';a.forEach(x=>{let b=document.createElement('button');b.textContent=x.name;b.onclick=()=>choose(x);$('res').appendChild(b)});say('검색 결과에서 목적지를 선택하세요.')}
async function choose(x){dest=x;$('q').value=x.name.split(',')[0];$('res').style.display='none';if(dm)map.removeLayer(dm);dm=L.marker([x.lat,x.lon]).addTo(map).bindPopup('목적지');try{me=me||await getMe()}catch(e){say('내 위치 권한이 필요합니다.');return}routeGo()}
async function routeGo(){say('자동차 경로 계산 중…');try{let u=`https://router.project-osrm.org/route/v1/driving/${me.lon},${me.lat};${dest.lon},${dest.lat}?overview=full&geometries=geojson`,r=await fetch(u),d=await r.json();route=d.routes[0].geometry.coordinates.map(c=>({lat:c[1],lon:c[0]}));if(line)map.removeLayer(line);line=L.polyline(route.map(x=>[x.lat,x.lon]),{weight:5}).addTo(map);map.fitBounds(line.getBounds(),{padding:[20,20]});say(`자동차 경로 약 ${(d.routes[0].distance/1000).toFixed(0)}km · 휴게소 NACS 우선 탐색 중…`);recommend()}catch(e){say('도로 경로 계산 실패. 잠시 후 다시 시도해 주세요.')}}
async function recommend(){let out=[];$('list').innerHTML='<div class="card">경로 주변 휴게소 검색 중…</div>';for(const s of S){if(filter!='ALL'&&s.o!=filter)continue;let c=await stationGeo(s);if(!c)continue,r=rd(c),from=hav(me,c);if(r<=12&&from>5)out.push({...s,...c,r,from});if(out.length>=10)break}out.sort((a,b)=>(a.p||0)-(b.p||0)||a.r-b.r||a.from-b.from);$('list').innerHTML=out.length?'':'<div class="card"><b>추천 충전소를 찾지 못했습니다.</b><div class="meta">좌표 검색 제한일 수 있으니 잠시 후 다시 시도하세요.</div></div>';out.slice(0,8).forEach((s,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<b>${i?'':'⭐ '}${s.n}</b> · ${s.o}<div class="meta">${s.s} · 실제 경로에서 약 ${s.r.toFixed(1)}km · 출발지에서 약 ${s.from.toFixed(0)}km ${s.p?'· ⚠ 개통 확인 필요':''}</div><a class="k" target="_blank" href="https://map.kakao.com/link/search/${encodeURIComponent(s.n)}">카카오맵 확인</a> <a class="b" target="_blank" href="https://map.kakao.com/link/to/${encodeURIComponent(s.n)},${s.lat},${s.lon}">여기로 길찾기</a>`;$('list').appendChild(d)})}
function clearDest(){dest=route=null;$('q').value='';$('res').style.display='none';$('list').innerHTML='';if(dm){map.removeLayer(dm);dm=null}if(line){map.removeLayer(line);line=null}say('목적지가 해제되었습니다.');map.setView([36.2,127.8],7)}
$('q').onkeydown=e=>{if(e.key==='Enter')searchDest()};document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');filter=c.dataset.op;if(route)recommend()});
</script></body></html>
